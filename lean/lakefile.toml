# Lean project for the paper "Sheil-Small's (1974) covering problem has a positive answer". Lean 4 v4.35.0 + Mathlib.
name = "SheilLean"
version = "0.1.0"
defaultTargets = ["Sheil"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "Sheil"
globs = ["Sheil", "Sheil.+"]
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false }
weakLeanArgs = ["-j1"]
